apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-api-pr-3
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/devshinthant/internal-developer-platform.git
    targetRevision: main
    path: charts/node-api
    helm:
      values: |
        image:
          tag: pr-3-526c762
        replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: preview-node-api-pr-3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
