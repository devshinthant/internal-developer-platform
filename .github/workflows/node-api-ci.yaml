name: node-api-ci

on:
  push:
    branches:
      - main
    paths:
      - services/node-api/**
      - .github/workflows/node-api-ci.yaml
  pull_request:
    paths:
      - services/node-api/**
      - .github/workflows/node-api-ci.yaml

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: services/node-api
        run: npm ci

      - name: Run tests
        working-directory: services/node-api
        run: npm test

      - name: Build Docker image
        run: |
          docker build \
            -t node-api:${{ github.sha }} \
            services/node-api
