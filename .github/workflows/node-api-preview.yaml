name: node-api-preview

on: 
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - services/node-api/**
      - .github/workflows/node-api-preview.yaml

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/node-api

jobs:
  build-preview-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set preview image tag
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
       
      - name: Set up Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: services/node-api
        run: npm ci

      - name: Run tests
        working-directory: services/node-api
        run: npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
         driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: services/node-api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.image }}

      - name: Checkout main for GitOps update
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate preview application
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PREVIEW_NAME="node-api-pr-${PR_NUMBER}"
          PREVIEW_NAMESPACE="preview-node-api-pr-${PR_NUMBER}"
          IMAGE_TAG="${{ steps.image.outputs.tag }}"

          mkdir -p previews/node-api

          cat > "previews/node-api/pr-${PR_NUMBER}.yaml" <<EOF
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            metadata:
              name: ${PREVIEW_NAME}
              namespace: argo-cd
            spec:
              project: default
              source:
                repoURL: https://github.com/devshinthant/internal-developer-platform.git
                targetRevision: main
                path: charts/node-api
                helm:
                  values: |
                    image:
                      tag: ${IMAGE_TAG}
                    replicaCount: 1
              destination:
                server: https://kubernetes.default.svc
                namespace: ${PREVIEW_NAMESPACE}
              syncPolicy:
                automated:
                  prune: true
                  selfHeal: true
                syncOptions:
                  - CreateNamespace=true
            EOF

      - name: Commit preview application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "previews/node-api/pr-${{ github.event.pull_request.number }}.yaml"

          if git diff --cached --quiet; then
            echo "No preview changes to commit"
            exit 0
          fi

          git commit -m "Update node-api preview for PR #${{ github.event.pull_request.number }}"
          git push origin HEAD:main
