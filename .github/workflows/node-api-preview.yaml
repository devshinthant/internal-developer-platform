name: node-api-preview

on: 
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - services/node-api/**
      - .github/workflows/node-api-preview.yaml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/node-api

jobs:
  build-preview-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set preview image tag
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
       
      - name: Set up Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: services/node-api
        run: npm ci

      - name: Run tests
        working-directory: services/node-api
        run: npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
         driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: services/node-api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.image }}
