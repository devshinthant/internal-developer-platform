apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: previews
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/devshinthant/internal-developer-platform.git
    targetRevision: main
    path: previews
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
