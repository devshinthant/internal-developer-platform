apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    argocd.argoproj.io/sync-wave: 0 
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - statefulsets
          - daemonsets
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kyverno
            - kube-system
  validations:
    - message: "all containers must define at least one health probe: livenessProbe, readinessProbe, or startupProbe"
      expression: >-
        object.spec.template.spec.containers.all(container,
          has(container.livenessProbe) ||
          has(container.readinessProbe) ||
          has(container.startupProbe)
        )
