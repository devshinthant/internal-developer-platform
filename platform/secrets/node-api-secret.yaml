apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: node-api-secret
  namespace: applications
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: local-secret-store
    kind: ClusterSecretStore
  target:
    name: node-api-secret
    creationPolicy: Owner
  data:
    - secretKey: DEMO_SECRET
      remoteRef:
        key: node-api-source-secret
        property: DEMO_SECRET
